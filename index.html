
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Le verre de l'amitié</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    img {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>
<body>
  <img src="verre_amitie.jpg"
       alt="Le verre de l'amitié">

  <audio id="voix" preload="auto" autoplay>
    <source src="verre_amitie_voix.mp3"
            type="audio/mpeg">
  </audio>

  <script>
    const voix = document.getElementById("voix");

    window.addEventListener("load", () => {
      voix.volume = 0.2;
      voix.play().catch(() => {
        console.log("Lecture automatique bloquée");
      });
    });
  </script>
</body>
</html>
